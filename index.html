<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Překladač řemeslné hantýrky | Fachmanka</title>
  <meta name="description" content="Slovník stavební řeči: zadejte pojem z rozpočtu nebo od řemeslníka a my ho srozumitelně přeložíme.">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#f9f5ec',
            foreground: '#19251e',
            card: '#ffffff',
            primary: '#005833',
            'primary-fg': '#ffffff',
            secondary: '#f0ebe0',
            muted: '#e7e4df',
            'muted-fg': '#6b736e',
            accent: '#92bc7c',
            border: '#dad7d0',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="font-sans antialiased bg-background text-foreground min-h-screen">

  <div class="max-w-2xl mx-auto px-4 sm:px-6 pt-8 pb-10">
    <header class="text-center mb-8">
      <h1 class="font-serif text-[2.25rem] sm:text-[2.7rem] md:text-[3.6rem] font-bold leading-tight text-foreground text-balance">
        Překladač ze stavební řeči
      </h1>
      <p class="text-base sm:text-lg text-muted-fg max-w-xl mx-auto mt-5 mb-8 leading-relaxed">
        Zadejte pojem z rozpočtu, smlouvy nebo od řemeslníka. Ať jde o stavbu, rekonstrukci, materiál nebo technologii.
      </p>
      <p class="text-xs font-medium uppercase tracking-wider text-primary mb-3">Zkuste například</p>
      <div id="tipChips" class="flex flex-wrap gap-2 justify-center mb-8"></div>

      <div class="relative text-left">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-fg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          id="searchInput"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder="Např. „vícepráce“…"
          class="w-full bg-card text-foreground placeholder-muted-fg rounded-xl border-2 border-border pl-11 pr-11 py-3.5 text-base font-medium focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
        >
        <button
          id="clearBtn"
          type="button"
          aria-label="Vymazat"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-muted text-muted-fg items-center justify-center"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <line x1="5" y1="5" x2="19" y2="19"></line>
            <line x1="19" y1="5" x2="5" y2="19"></line>
          </svg>
        </button>
      </div>

      <div id="categoryChips" class="flex flex-wrap gap-2 mt-3 justify-center"></div>
    </header>

    <p id="resultCount" class="text-xs font-medium uppercase tracking-wider text-muted-fg mb-3 min-h-[1rem]" aria-live="polite"></p>
    <main id="cardList" class="flex flex-col gap-4"></main>

    <div id="emptyState" class="hidden mt-8 text-center" aria-hidden="true">
      <p class="font-serif text-2xl font-bold mb-2">Tento pojem tu ještě nemáme.</p>
      <p class="text-muted-fg text-sm max-w-sm mx-auto">Zkuste jiný výraz nebo jinou kategorii.</p>
    </div>
  </div>

  <script src="js/terms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
